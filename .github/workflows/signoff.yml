name: klt signoff

# The T1 tier state is graded, not hand-read: re-render the tier-verdict
# report from the committed block manifest and byte-compare it against the
# committed verdict of record. Drift fails the check; regenerate the record
# in the same PR so the change lands in the diff for a reviewer to see.
# The klayout-tools pin lives in .github/klt-version, and nowhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the pre-#92 fixture test compares the committed cell
      # against `git show e310b5f:...`, and a depth-1 clone makes it skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned klt
        run: pip install "klayout-tools==$(cat .github/klt-version)"

      - name: Install numpy for the pure-Python checks
        run: pip install -r sim/bmodel/requirements.txt

      - name: Validate committed JSON parses
        run: |
          set -euo pipefail
          find manifests attestation design/attest -name '*.json' -print0 | sort -z |
            while IFS= read -r -d '' f; do
              python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; exit 1; }
              echo "ok: $f"
            done

      - name: Check the item-9 testbench attestation still reproduces
        run: |
          # cold_start is local_only (needs ngspice, iverilog, yosys, the PDK):
          # --check skips it and reports it, but still re-hashes every bench file
          # and the inventory itself.
          klt signoff --attest 9 --inventory attestation/item9-inventory.json \
                      --check attestation/item9-envelope.json

      # Item 8 (characterization report): the pinned klt's --attest takes only
      # items 1, 9 and 10, so attestation/item8_envelope.py regenerates the
      # generic envelope from measurements/characterization.md in memory and
      # fails if the committed one differs (a hand-edited verdict, a cited
      # record that changed, a missing file, a pending row with no issue).
      - name: Check the item-8 characterization envelope still reproduces
        run: python3 -I attestation/item8_envelope.py --check

      # The grammar the step above enforces, in particular that a `declared-gap`
      # row cites the ratified record that declares it and never reads as
      # evidence (issue #131). Fixtures only: no EDA tools.
      - name: Item-8 envelope grammar unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s attestation -p 'test_*.py'

      # Item 6 (digital partition) is discharged by a recorded
      # `not_applicable`, which klt signoff hash-binds to two JSON files under
      # spec/. klt cannot see that those files are a projection of the ratified
      # Markdown, so this check binds that last link: it re-derives the row
      # projection from spec/modulator-adc.md section 1.1 and fails if the
      # Markdown no longer hashes to the value recorded in the projection.
      # Editing the ratified spec therefore invalidates the claim loudly.
      # Runs before the byte-compare below so the failure names the cause.
      - name: Decimator spec projection is bound to the ratified spec (no EDA tools)
        run: python3 -I -m unittest discover -s spec -p 'test_*.py'

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-sigma-delta-adc.json \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at least
          # one item is unmet. Both are valid grader runs. Anything else is a
          # hard error (manifest unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-sigma-delta-adc.signoff.json; then
            echo "::error::Fresh klt signoff output differs from manifests/sky130-sigma-delta-adc.signoff.json - the committed verdict is stale or hand-edited."
            echo "Regenerate and commit it in this same PR:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff \\"
            echo "      --manifest manifests/sky130-sigma-delta-adc.json --format json \\"
            echo "      > manifests/sky130-sigma-delta-adc.signoff.json"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-sigma-delta-adc.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."

      # The item-10 (repo hygiene) attestation is derived, not asserted:
      # re-run the inventory's checks against the committed envelope.
      # local_only checks are skipped here and run as explicit steps below.
      - name: Check the item-10 attestation is current
        run: |
          klt signoff --attest 10 --inventory attestation/item10-inventory.json \
                      --check attestation/item10-envelope.json

      - name: Behavioural model unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/bmodel -p 'test_*.py'

      # The gates that decide whether a settling record is written at all, and
      # the runner paths that admit a result into one (issue #94). Fixtures
      # only: no fleet, no ngspice, no klt.
      - name: Settling record-admission unit tests (no EDA tools)
        run: |
          python3 -I -m unittest discover -s sim -p 'test_settling*.py'
          python3 -I -m unittest discover -s sim/integrator-settling -p 'test_*.py'

      # The charge-injection bench's record-admission gates and derivations
      # (issue #102), plus the checks that the committed decks/requests still
      # match their generator and that the pre-#92 comparison fixture still
      # matches the commit it names. Fixtures only: no fleet, no ngspice, no klt.
      - name: Charge-injection record-admission unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/integrator-ci -p 'test_*.py'

      # The DC-gain and thermal-noise benches' record-admission gates and the
      # derivations their records depend on (issue #126): V/V -> dB and the
      # binding corner for the gain bench; the input referral, the V^2 -> FS^2
      # conversion, the two in-band links and the per-corner budget verdicts
      # for the noise bench. Plus the checks that the committed decks and
      # requests still match their generators. Fixtures only: no fleet, no
      # ngspice, no klt.
      - name: Gain and noise record-admission unit tests (no EDA tools)
        run: |
          python3 -I -m unittest discover -s sim/ota-gain -p 'test_*.py'
          python3 -I -m unittest discover -s sim/integrator-noise -p 'test_*.py'

      # The comparator bench's derivations (model-B unit conversion, the
      # offset/hysteresis inversion, the decision-time limit), the staircase
      # geometry, and the gates that decide whether its record is written at
      # all (issue #127). Fixtures only: no fleet, no ngspice, no klt.
      - name: Comparator decision record-admission unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/comparator-decision -p 'test_*.py'

      - name: Decimator whole-chain response, spec rows 8-9 (no EDA tools)
        working-directory: verification/decimator
        run: python3 response.py
