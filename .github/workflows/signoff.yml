name: klt signoff

# The T1 tier state is graded, not hand-read: re-render the tier-verdict
# report from the committed block manifest and byte-compare it against the
# committed verdict of record. Drift fails the check; regenerate the record
# in the same PR so the change lands in the diff for a reviewer to see.
# The klayout-tools pin lives in .github/klt-version, and nowhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the pre-#92 fixture test compares the committed cell
      # against `git show e310b5f:...`, and a depth-1 clone makes it skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned klt
        run: pip install "klayout-tools==$(cat .github/klt-version)"

      - name: Install numpy for the pure-Python checks
        run: pip install -r sim/bmodel/requirements.txt

      # Two gates over every tracked Python file, in one listing pass. Gate
      # 1 is pyflakes, failing on one finding class only: a name that is
      # never bound ("undefined name" / "undefined local variable"). None of
      # the fleet-only runner paths (the run_tran.py main() bodies and their
      # kin) execute in CI, and issue #272 watched a NameError in exactly
      # such a path reach main and crash a completed fleet run at its
      # partial-cache save -- after the batch was already paid for. pyflakes
      # has no rule-select flag, so the gate greps its output. The other
      # finding kinds (unused imports, unused locals, placeholder-less
      # f-strings -- 8 as of Nov 2026) are printed but deliberately not
      # failed on; gating on them is separate cleanup, not this step's job.
      # Gate 2 (issue #277) compiles every file in the same listing:
      # an unparseable file makes pyflakes print a syntax-error line whose
      # wording varies by shape ("invalid syntax", "'(' was never closed",
      # IndentationError, ...) and exit 1 -- neither a string the grep
      # matches nor an rc the rc>1 guard fires on, so such a file used to
      # pass green. compile() is the parser import itself uses, so the gate
      # is wording-independent, and it writes no bytecode (python -m
      # py_compile emits __pycache__ even under PYTHONDONTWRITEBYTECODE=1 --
      # measured on 3.12). `.loom/` is installer-vendored, so a finding
      # there is not actionable in this repo and is excluded by path. The
      # listing is null-delimited so a filename with spaces survives, and an
      # empty file list exits 0 rather than tripping grep's no-match status.
      - name: Tracked Python parses and has no undefined names (no EDA tools)
        run: |
          set -euo pipefail
          pip install pyflakes==4.1.0
          python3 -m pyflakes --version
          mapfile -d '' files < <(git ls-files -z '*.py' | grep -zv '^\.loom/')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tracked Python outside .loom/ - nothing to lint"
            exit 0
          fi
          rc=0
          out="$(python3 -m pyflakes "${files[@]}" 2>&1)" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::pyflakes exited $rc (usage/interpreter error), see output below"
            echo "$out"
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "$out"
          fi
          if grep -Eq "undefined name|undefined local variable" <<<"$out"; then
            echo "::error::pyflakes found a name that is never bound - see the output above"
            exit 1
          fi
          echo "pyflakes: no undefined names in ${#files[@]} tracked Python files"
          crc=0
          python3 - "${files[@]}" <<'PYEOF' || crc=$?
          import sys

          status = 0
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as fh:
                      compile(fh.read(), path, "exec")
              except OSError as exc:
                  print(f"::error file={path}::unreadable: {exc.strerror or exc}")
                  status = 1
              except (SyntaxError, ValueError) as exc:
                  line = getattr(exc, "lineno", None) or 1
                  msg = getattr(exc, "msg", None) or str(exc)
                  print(f"::error file={path},line={line}::{type(exc).__name__}: {msg}")
                  status = 1
          sys.exit(status)
          PYEOF
          if [ "$crc" -ne 0 ]; then
            echo "::error::a tracked Python file does not parse - see the annotations above"
            exit 1
          fi
          echo "compile: all ${#files[@]} tracked Python files parse"

      - name: Validate committed JSON parses
        run: |
          set -euo pipefail
          find manifests attestation design/attest -name '*.json' -print0 | sort -z |
            while IFS= read -r -d '' f; do
              python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; exit 1; }
              echo "ok: $f"
            done

      - name: Check the item-9 testbench attestation still reproduces
        run: |
          # cold_start is local_only (needs ngspice, iverilog, yosys, the PDK):
          # --check skips it and reports it, but still re-hashes every bench file
          # and the inventory itself.
          klt signoff --attest 9 --inventory attestation/item9-inventory.json \
                      --check attestation/item9-envelope.json

      # Item 8 (characterization report): the pinned klt's --attest takes only
      # items 1, 9 and 10, so attestation/item8_envelope.py regenerates the
      # generic envelope from measurements/characterization.md in memory and
      # fails if the committed one differs (a hand-edited verdict, a cited
      # record that changed, a missing file, a pending row with no issue).
      - name: Check the item-8 characterization envelope still reproduces
        run: python3 -I attestation/item8_envelope.py --check

      # The grammar the step above enforces, in particular that a `declared-gap`
      # row cites the ratified record that declares it and never reads as
      # evidence (issue #131). Fixtures only: no EDA tools.
      - name: Item-8 envelope grammar unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s attestation -p 'test_*.py'

      # The manifest's content_hash pins are the claim that a citation names
      # a particular declared input, and klt signoff verifies a citation's
      # pin only against the cited file's provenance.input.content_hash --
      # a pin on a file with no provenance block is a latent blocker it
      # grades unverifiable_provenance (masked while the item also fails its
      # own check; issue #155). This step asserts the repo invariant
      # directly, in both directions: a citation declares a pin iff the
      # cited file carries provenance.input.content_hash and equals it --
      # a missing pin where the file carries one fails too (issue #215);
      # a not_applicable spec/statement binding pins the cited file's own
      # sha256. Runs before the byte-compare below so a violation names
      # the offending key.
      - name: Manifest content-hash pins are verifiable (no EDA tools)
        run: |
          python3 -I -m unittest discover -s manifests -p 'test_check_content_hashes.py'
          python3 -I manifests/check_content_hashes.py

      # The status documents hand-state the record's headline counts
      # ("N met, M not applicable, K unmet"), which is how ROADMAP.md said
      # 9 / 1 / 12 beside a record reading 10 / 1 / 11 through two regrades
      # (issue #221). This step derives the counts from the record's t1_*
      # fields and fails on any sentence in README.md or ROADMAP.md that
      # disagrees; a file with no count sentence asserts nothing. Same
      # fixtures-only shape as the content-hash gate above.
      - name: Prose T1-count sentences match the verdict of record (no EDA tools)
        run: |
          python3 -I -m unittest discover -s manifests -p 'test_check_prose_counts.py'
          python3 -I manifests/check_prose_counts.py

      # Item 6 (digital partition) is discharged by a recorded
      # `not_applicable`, which klt signoff hash-binds to two JSON files under
      # spec/. klt cannot see that those files are a projection of the ratified
      # Markdown, so this check binds that last link: it re-derives the row
      # projection from spec/modulator-adc.md section 1.1 and fails if the
      # Markdown no longer hashes to the value recorded in the projection.
      # Editing the ratified spec therefore invalidates the claim loudly.
      # Runs before the byte-compare below so the failure names the cause.
      - name: Decimator spec projection is bound to the ratified spec (no EDA tools)
        run: python3 -I -m unittest discover -s spec -p 'test_*.py'

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-sigma-delta-adc.json \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at least
          # one item is unmet. Both are valid grader runs. Anything else is a
          # hard error (manifest unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-sigma-delta-adc.signoff.json; then
            echo "::error::Fresh klt signoff output differs from manifests/sky130-sigma-delta-adc.signoff.json - the committed verdict is stale or hand-edited."
            echo "Regenerate and commit it in this same PR:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff \\"
            echo "      --manifest manifests/sky130-sigma-delta-adc.json --format json \\"
            echo "      > manifests/sky130-sigma-delta-adc.signoff.json"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-sigma-delta-adc.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."

      # The item-10 (repo hygiene) attestation is derived, not asserted:
      # re-run the inventory's checks against the committed envelope.
      # local_only checks are skipped here and run as explicit steps below.
      - name: Check the item-10 attestation is current
        run: |
          klt signoff --attest 10 --inventory attestation/item10-inventory.json \
                      --check attestation/item10-envelope.json

      - name: Behavioural model unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/bmodel -p 'test_*.py'

      # The gates that decide whether a settling record is written at all, and
      # the runner paths that admit a result into one (issue #94). Fixtures
      # only: no fleet, no ngspice, no klt.
      - name: Settling record-admission unit tests (no EDA tools)
        run: |
          python3 -I -m unittest discover -s sim -p 'test_settling*.py'
          python3 -I -m unittest discover -s sim/integrator-settling -p 'test_*.py'

      # The charge-injection bench's record-admission gates and derivations
      # (issue #102), plus the checks that the committed decks/requests still
      # match their generator and that the pre-#92 comparison fixture still
      # matches the commit it names. Fixtures only: no fleet, no ngspice, no klt.
      - name: Charge-injection record-admission unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/integrator-ci -p 'test_*.py'

      # The DC-gain and thermal-noise benches' record-admission gates and the
      # derivations their records depend on (issue #126): V/V -> dB and the
      # binding corner for the gain bench; the input referral, the V^2 -> FS^2
      # conversion, the two in-band links and the per-corner budget verdicts
      # for the noise bench. Plus the checks that the committed decks and
      # requests still match their generators. Fixtures only: no fleet, no
      # ngspice, no klt.
      - name: Gain and noise record-admission unit tests (no EDA tools)
        run: |
          python3 -I -m unittest discover -s sim/ota-gain -p 'test_*.py'
          python3 -I -m unittest discover -s sim/integrator-noise -p 'test_*.py'

      # The comparator bench's derivations (model-B unit conversion, the
      # offset/hysteresis inversion, the decision-time limit), the staircase
      # geometry, and the gates that decide whether its record is written at
      # all (issue #127). Fixtures only: no fleet, no ngspice, no klt.
      - name: Comparator decision record-admission unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/comparator-decision -p 'test_*.py'

      # The short full-modulator transient's record-admission gates (issue
      # #125): a partial grid, a missing measurement, a short per-clock sample
      # set, a clock that did not run at fs, or two power routes that
      # disagree must each refuse the record. Also checks the committed deck
      # and request still match their generator. Fixtures only: no fleet, no
      # ngspice, no klt.
      - name: Full-modulator transient record-admission unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/modulator-tran -p 'test_*.py'

      # The digital-partition P&R runner's PDK-pin refusal (issue #158): the gate
      # reads the stamp klt records at provenance.pdk.version, so a report whose
      # PDK differs from sim/pdk.json -- or that records no PDK at all -- refuses
      # with exit 2 instead of admitting an unpinned route as pinned evidence.
      # Fixtures only: subprocess.run is patched, no klt, no openroad, no PDK.
      - name: Digital P&R PDK-pin refusal unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s layout/digital -p 'test_*.py'

      # All layout/analog suites in one directory-scoped step (issue #211
      # collapsed the two per-suite steps that overlapped here):
      # - the analog generators' DRC-verdict guard (issue #164): `klt drc` exits
      #   3 on violations but the call site passes check=False to capture the
      #   report, so the verdict is re-asserted in-process and a non-clean
      #   report aborts the flow. Fixtures only: synthetic report dicts.
      # - the shared extracted-netlist parsers in layout/analog/layout_common.py
      #   (issue #191): parse_extract_devices and extract_nets turn `klt extract`
      #   output into the device- and net-count evidence both analog cells commit
      #   (extract-device-count.json), and since #179 nothing else executes them.
      #   The suite asserts the parsers against real captured netlists
      #   (layout/analog/fixtures/) and each cell's committed evidence, and pins
      #   the _symmetric_terminals/_is_model_token predicates -- a regression in
      #   either parser restates that evidence for every analog cell at once.
      # - the Router geometry core (issue #228) and the Router methods #201
      #   unified into the shared base (issue #201): pure geometry over the
      #   shared `Router`, no fixtures.
      # Fixtures only: no klt, no PDK, no network.
      - name: Analog generator unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s layout/analog -p 'test_*.py'

      # The switch probes' pure parts: that the issue #106 pass-gate sweep still
      # covers the spec row 11 input range at the resolution it claims, and that
      # the probed device pair still matches design/integrator/integrator.spice.
      # Fixtures only: no fleet, no ngspice, no klt.
      - name: Switch-probe sweep-coverage unit tests (no EDA tools)
        run: python3 -I -m unittest discover -s sim/switch-probe -p 'test_*.py'

      - name: Decimator whole-chain response, spec rows 8-9 (no EDA tools)
        working-directory: verification/decimator
        run: python3 response.py
